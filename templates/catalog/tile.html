{% load wagtailimages_tags nav_tags %}
<a class="tile{% if not product.is_available %} tile--sold{% endif %}" href="{{ product.url }}">
  <span class="tile__media">
    {% if product.main_image %}{% image product.main_image fill-720x960 class="tile__img" loading="lazy" alt="" %}{% endif %}
  </span>
  <span class="tile__meta">
    <span class="tile__title">{{ product.title }}</span>
    <span class="tile__price">{{ product.price|rub }}</span>
  </span>
  <span class="tile__cta">{% if product.is_available %}+ В корзину{% else %}Нет в наличии{% endif %}</span>
</a>
